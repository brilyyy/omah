name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - main
      - master

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Desktop app + CLI (unified binary) ──────────────────────────────────────

  build-desktop:
    name: Build ${{ matrix.name }}
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-aarch64
            os: macos-latest

          - name: macos-x86_64
            os: macos-13

          - name: linux-x86_64
            os: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-desktop-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-desktop-

      - name: Install frontend dependencies
        run: bun install

      - name: Build
        run: bun run tauri build

      - name: Package CLI tarball (macOS)
        if: startsWith(matrix.os, 'macos')
        id: pkg_cli_macos
        run: |
          ARCH=$(uname -m)
          [ "$ARCH" = "arm64" ] && TRIPLE="aarch64-apple-darwin" || TRIPLE="x86_64-apple-darwin"
          ARCHIVE="omah-${{ github.ref_name }}-${TRIPLE}.tar.gz"
          strip target/release/omah
          tar -czf "${ARCHIVE}" -C target/release omah
          echo "archive=${ARCHIVE}" >> $GITHUB_OUTPUT

      - name: Package CLI tarball (Linux)
        if: matrix.os == 'ubuntu-22.04'
        id: pkg_cli_linux
        run: |
          ARCHIVE="omah-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz"
          strip target/release/omah
          tar -czf "${ARCHIVE}" -C target/release omah
          echo "archive=${ARCHIVE}" >> $GITHUB_OUTPUT

      - name: Upload macOS dmg
        if: startsWith(matrix.os, 'macos')
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: target/release/bundle/dmg/*.dmg
          retention-days: 1
          if-no-files-found: error

      - name: Upload macOS CLI tarball
        if: startsWith(matrix.os, 'macos')
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.name }}
          path: ${{ steps.pkg_cli_macos.outputs.archive }}
          retention-days: 1
          if-no-files-found: error

      - name: Upload Linux AppImage
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: target/release/bundle/appimage/*.AppImage
          retention-days: 1
          if-no-files-found: error

      - name: Upload Linux CLI tarball
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.name }}
          path: ${{ steps.pkg_cli_linux.outputs.archive }}
          retention-days: 1
          if-no-files-found: error

  # ── GitHub Release ────────────────────────────────────────────────────────────

  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "omah ${{ github.ref_name }}"
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
